version: "2"

linters:
  default: none
  enable:
    - bodyclose # Unclosed HTTP response bodies
    - errcheck # Unchecked errors (e.g. file.Close)
    - gosec # Security issues (e.g. G304)
    - govet # Standard Go vetting
    - revive # Missing comments, naming
    - staticcheck # Bugs, simplifications, deprecated APIs
  settings:
    revive:
      rules:
        - name: exported
          arguments:
            - disableStutteringCheck
  exclusions:
    paths:
      - third_party
      - builtin
      - examples

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/mikemadden42
